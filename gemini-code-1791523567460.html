<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Collection Booking</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin: 10px 0 5px; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Book Home Collection</h2>
    <form action="/submit-booking" method="POST">
        <label for="name">Patient Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter patient name">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter contact number">

        <label for="service">Service Required</label>
        <select id="service" name="service" required>
            <option value="">Select a service</option>
            <option value="Blood Test">Blood Test</option>
            <option value="ECG">ECG</option>
            <option value="Nursing Care">Nursing Care</option>
        </select>

        <label for="address">Full Location/Address</label>
        <textarea id="address" name="address" rows="3" required placeholder="Enter collection address"></textarea>

        <label for="date">Preferred Date</label>
        <input type="date" id="date" name="date" required>

        <button type="submit">Book Now</button>
    </form>
</div>

</body>
</html>
